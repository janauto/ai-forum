<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTO//SIM — 硬件原型联动验证平台</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">◆</span>
                <span class="logo-text">PROTO<span class="logo-slash">//</span>SIM</span>
                <span class="logo-sub">硬件原型联动验证平台</span>
            </div>
            <div class="header-status">
                <span class="status-indicator active" id="status-dot"></span>
                <span class="status-text" id="status-text">系统就绪</span>
                <span class="status-time" id="status-time">--</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Left: Component Library -->
            <aside class="left-panel">
                <div class="panel-header">
                    <h2>组件库</h2>
                    <span class="panel-hint">拖入视口</span>
                </div>
                <div class="panel-content" id="library-content"><!-- 由 JS 渲染 --></div>
            </aside>

            <!-- Center: Viewport Grid (Rhino-style) -->
            <main class="center-stage">
                <div class="stage-toolbar">
                    <div class="stage-tools-left">
                        <button class="stage-btn" id="add-hw-vp" title="新增硬件视口"><span>＋</span> 硬件板</button>
                        <button class="stage-btn" id="add-mobile-vp" title="新增手机视口"><span>＋</span> 手机</button>
                        <button class="stage-btn" id="add-topo-vp" title="新增拓扑视口"><span>＋</span> 拓扑</button>
                        <div class="toolbar-divider"></div>
                        <span class="layout-label">布局</span>
                        <button class="stage-btn layout-btn" data-layout="1">▢</button>
                        <button class="stage-btn layout-btn active" data-layout="2">▢▢</button>
                        <button class="stage-btn layout-btn" data-layout="4">⊞</button>
                    </div>
                    <div class="stage-tools-right">
                        <span class="sim-hint" id="sim-hint">提示：点硬件板上的按键，看手机联动</span>
                    </div>
                </div>
                <div class="viewport-grid layout-2" id="viewport-grid"><!-- 视口由 JS 渲染 --></div>
            </main>

            <!-- Right: Inspector -->
            <aside class="right-panel">
                <div class="panel-tabs">
                    <button class="tab-btn active" data-tab="props">属性</button>
                    <button class="tab-btn" data-tab="bindings">联动</button>
                    <button class="tab-btn" data-tab="prd">PRD</button>
                    <button class="tab-btn" data-tab="json">状态机</button>
                    <button class="tab-btn" data-tab="code">代码</button>
                </div>

                <div class="tab-content" id="tab-props">
                    <div class="panel-content" id="props-content">
                        <div class="empty-hint">
                            <div class="empty-icon">⌖</div>
                            <div>选择一个设备查看属性</div>
                        </div>
                    </div>
                </div>

                <div class="tab-content hidden" id="tab-bindings">
                    <div class="panel-header sub">
                        <h3>联动规则</h3>
                        <button class="mini-btn" id="add-binding">＋ 新增</button>
                    </div>
                    <div class="panel-content" id="bindings-content"></div>
                </div>

                <div class="tab-content hidden" id="tab-prd">
                    <div class="panel-header sub">
                        <h3>产品需求文档</h3>
                        <button class="mini-btn" id="load-sample">载入示例</button>
                    </div>
                    <textarea class="prd-editor" id="prd-input" placeholder="# 产品需求文档（PRD）

## 功能描述
描述产品的核心功能与交互...

## 硬件模块
- 按键：用户输入触发
- LED 指示灯：状态显示
- 蜂鸣器：提示音
- 温度传感器：环境监测
- OLED 屏：本地显示

## 上位机
- iOS App：远程查看温度、控制开关

## 交互流程
1. 用户按下按键 → LED 切换 + 蜂鸣
2. 温度变化 → OLED 显示 + 手机 App 同步
3. 手机 App 开关 → 控制硬件"></textarea>
                </div>

                <div class="tab-content hidden" id="tab-json">
                    <div class="panel-header sub">
                        <h3>状态机 JSON</h3>
                        <button class="mini-btn" id="copy-json">复制</button>
                    </div>
                    <pre class="code-viewer" id="json-output">{ }</pre>
                </div>

                <div class="tab-content hidden" id="tab-code">
                    <div class="panel-header sub">
                        <h3>固件骨架</h3>
                        <button class="mini-btn" id="copy-code">复制</button>
                    </div>
                    <pre class="code-viewer" id="code-output">// 点击底部「导出代码」生成</pre>
                </div>
            </aside>
        </div>

        <!-- Bottom Toolbar -->
        <footer class="bottom-toolbar">
            <div class="toolbar-section">
                <button class="action-btn demo" id="btn-powerbank"><span class="ab-icon">🔋</span> 充电宝Demo</button>
                <button class="action-btn" id="btn-parse-prd"><span class="ab-icon">⚡</span> 解析PRD</button>
                <button class="action-btn" id="btn-topology"><span class="ab-icon">◈</span> 生成拓扑</button>
                <button class="action-btn primary" id="btn-simulate"><span class="ab-icon">▶</span> 运行模拟</button>
                <button class="action-btn" id="btn-export"><span class="ab-icon">↓</span> 导出代码</button>
                <button class="action-btn ghost" id="btn-clear"><span class="ab-icon">⌫</span> 清空</button>
            </div>
            <div class="toolbar-log" id="event-log">
                <span class="log-line log-muted">事件日志…</span>
            </div>
            <div class="toolbar-info">
                <span class="info-item">设备 <b id="stat-devices">0</b></span>
                <span class="info-divider">·</span>
                <span class="info-item">联动 <b id="stat-bindings">0</b></span>
                <span class="info-divider">·</span>
                <span class="info-item">视口 <b id="stat-viewports">0</b></span>
            </div>
        </footer>
    </div>

    <script src="chipdb.js"></script>
    <script src="architecture.js"></script>
    <script src="library.js"></script>
    <script src="engine.js"></script>
    <script src="prd.js"></script>
    <script src="codegen_enhanced.js"></script>
    <script src="app.js"></script>
</body>
</html>
